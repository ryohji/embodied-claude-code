[project]
name = "camera-daemon-mcp"
version = "0.1.0"
description = "MCP server that manages go2rtc lifecycle for Tapo camera streaming"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "PyYAML>=6.0",
    "onvif-zeep-async>=0.2.12",
    "Pillow>=10.0",
    "python-dotenv>=1.0",
    "httpx>=0.24",
]

[project.scripts]
camera-daemon-mcp = "camera_daemon_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camera_daemon_mcp"]
